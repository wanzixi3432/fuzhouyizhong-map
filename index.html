<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="福州一中回忆地图：浏览校园卫星地图，无需登录即可在各地匿名记录回忆、感想并上传照片。"
    />
    <meta name="theme-color" content="#8f2f24" />
    <title>福州一中回忆地图</title>
    <style>
:root {
  --paper: #f2ede3;
  --surface: #fffdf8;
  --ink: #1d2923;
  --muted: #6e7972;
  --line: rgba(39, 52, 44, 0.14);
  --red: #a13a2c;
  --red-deep: #7f281f;
  --green: #2f746a;
  --gold: #b78536;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--paper);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body.modal-open {
  overflow: hidden;
}

button,
input,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

button,
[role="button"] {
  touch-action: manipulation;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.app-shell {
  min-height: 100vh;
}

.site-header {
  position: relative;
  z-index: 1200;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.97);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  color: var(--ink);
  text-decoration: none;
}

.brand-mark {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50% 50% 50% 13px;
  background: var(--red);
  color: #fffaf2;
  box-shadow: 0 7px 18px rgba(128, 39, 29, 0.24);
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  transform: rotate(-7deg);
}

.brand-copy {
  min-width: 0;
}

.brand-copy strong,
.brand-copy small {
  display: block;
}

.brand-copy strong {
  overflow: hidden;
  font-family: var(--serif);
  font-size: 20px;
  letter-spacing: 0.035em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-copy small {
  margin-top: 2px;
  color: var(--muted);
  font-size: 9px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.source-label {
  color: #858e88;
  font-size: 9px;
}

.connection-badge {
  padding: 5px 8px;
  border-radius: 999px;
  background: rgba(47, 116, 106, 0.1);
  color: #28685f;
  font-size: 9px;
  white-space: nowrap;
}

.connection-badge.is-error {
  background: rgba(161, 58, 44, 0.1);
  color: #91372b;
}

.anonymous-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 150px;
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid rgba(47, 116, 106, 0.22);
  border-radius: 8px;
  background: rgba(47, 116, 106, 0.08);
  color: #28685f;
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
}

.anonymous-badge svg {
  width: 13px;
  height: 13px;
}

.account-button {
  max-width: 140px;
  min-height: 34px;
  padding: 0 12px;
  overflow: hidden;
  border: 1px solid rgba(161, 58, 44, 0.28);
  border-radius: 8px;
  background: rgba(161, 58, 44, 0.075);
  color: var(--red-deep);
  font-size: 10px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.account-button.is-authenticated {
  border-color: rgba(47, 116, 106, 0.25);
  background: rgba(47, 116, 106, 0.09);
  color: #28685f;
}

.workspace {
  height: calc(100vh - 72px);
  display: grid;
  grid-template-columns: 350px minmax(0, 1fr);
  overflow: hidden;
}

.places-panel {
  position: relative;
  z-index: 3;
  min-width: 0;
  padding: 24px 19px 30px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: rgba(255, 253, 248, 0.96);
}

.eyebrow {
  margin: 0;
  color: var(--red);
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.14em;
  line-height: 1.5;
}

.panel-intro h1 {
  margin: 7px 0 0;
  font-family: var(--serif);
  font-size: 32px;
  line-height: 1.16;
  letter-spacing: -0.02em;
}

.panel-intro > p:last-child {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.7;
}

.search-field {
  height: 39px;
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 20px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #f9f6ef;
}

.search-field svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  color: #7d8780;
}

.search-field input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 11px;
}

.search-field input::placeholder {
  color: #98a09b;
}

.zone-tabs {
  display: flex;
  gap: 4px;
  margin-top: 12px;
  padding: 4px;
  overflow-x: auto;
  border-radius: 9px;
  background: #f2eee6;
  scrollbar-width: none;
}

.zone-tabs::-webkit-scrollbar {
  display: none;
}

.zone-tabs button {
  min-width: 48px;
  min-height: 30px;
  flex: 1 0 auto;
  padding: 0 7px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #727d76;
  font-size: 9px;
  font-weight: 650;
  cursor: pointer;
}

.zone-tabs button.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(34, 43, 37, 0.08);
}

.place-list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 23px;
}

.place-list-heading strong {
  font-family: var(--serif);
  font-size: 19px;
}

.place-list-heading span {
  color: #8c958f;
  font-size: 8px;
}

.place-list {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.place-card {
  width: 100%;
  display: grid;
  grid-template-columns: 29px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease,
    transform 160ms ease;
}

.place-card:hover,
.place-card.is-selected {
  border-color: rgba(161, 58, 44, 0.38);
  box-shadow: 0 7px 18px rgba(45, 40, 33, 0.08);
  transform: translateY(-1px);
}

.place-card.is-child {
  width: calc(100% - 18px);
  margin-left: 18px;
  border-left: 2px solid rgba(183, 133, 54, 0.5);
}

.place-card-index {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(161, 58, 44, 0.08);
  color: var(--red);
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 700;
}

.place-card-main {
  min-width: 0;
}

.place-card-main strong,
.place-card-main small {
  display: block;
}

.place-card-main strong {
  overflow: hidden;
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.place-card-main small {
  margin-top: 3px;
  color: #8a938d;
  font-size: 8px;
}

.memory-count {
  padding: 4px 6px;
  border-radius: 6px;
  background: rgba(47, 116, 106, 0.08);
  color: #347269;
  font-size: 8px;
  white-space: nowrap;
}

.memory-count.is-empty {
  background: #f4f0e8;
  color: #9a9f9a;
}

.empty-list {
  padding: 32px 16px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: #8a938d;
  font-size: 10px;
  text-align: center;
}

.map-panel {
  position: relative;
  z-index: 1;
  min-width: 0;
  overflow: hidden;
  background: #d8d5ca;
}

.map-viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background:
    linear-gradient(rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.04)),
    #c9c8bf;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.map-viewport.is-dragging {
  cursor: grabbing;
}

.map-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  transform-origin: 0 0;
  will-change: transform;
}

.map-canvas.is-animating {
  transition: transform 250ms ease-out;
}

.map-canvas img {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}

.map-markers {
  position: absolute;
  inset: 0;
}

.place-marker {
  position: absolute;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.place-marker::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255, 253, 248, 0.95);
  border-radius: 50%;
  background: var(--red);
  box-shadow:
    0 3px 12px rgba(26, 33, 28, 0.34),
    0 0 0 3px rgba(161, 58, 44, 0.16);
  transform: translate(-50%, -50%);
}

.place-marker:hover::before,
.place-marker.is-selected::before {
  width: 17px;
  height: 17px;
  background: #f15d3e;
  box-shadow:
    0 4px 14px rgba(26, 33, 28, 0.38),
    0 0 0 7px rgba(241, 93, 62, 0.16);
}

.place-marker.is-minor::before {
  width: 10px;
  height: 10px;
  border-color: #fffaf1;
  background: var(--gold);
  box-shadow:
    0 3px 10px rgba(26, 33, 28, 0.32),
    0 0 0 3px rgba(183, 133, 54, 0.18);
}

.place-marker.is-minor:hover::before,
.place-marker.is-minor.is-selected::before {
  width: 13px;
  height: 13px;
  background: #d09b43;
}

.place-marker span {
  position: absolute;
  left: 50%;
  bottom: 34px;
  max-width: 150px;
  padding: 5px 8px;
  border-radius: 6px;
  background: rgba(28, 38, 32, 0.88);
  color: #fffdf8;
  font-size: 9px;
  line-height: 1.3;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(4px);
  transition:
    opacity 140ms ease,
    transform 140ms ease;
  white-space: nowrap;
}

.place-marker:hover span,
.place-marker:focus span,
.place-marker.is-selected span {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.map-toolbar {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px;
  pointer-events: none;
}

.map-hint {
  padding: 8px 11px;
  border-radius: 8px;
  background: rgba(255, 253, 248, 0.91);
  color: #657069;
  box-shadow: 0 4px 14px rgba(27, 35, 30, 0.1);
  font-size: 9px;
  pointer-events: auto;
}

.map-actions {
  display: flex;
  gap: 5px;
  pointer-events: auto;
}

.map-actions button {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(41, 52, 45, 0.12);
  border-radius: 8px;
  background: rgba(255, 253, 248, 0.93);
  color: #34443b;
  box-shadow: 0 4px 14px rgba(27, 35, 30, 0.1);
  cursor: pointer;
}

.map-actions svg {
  width: 15px;
  height: 15px;
}

.map-status {
  position: absolute;
  z-index: 12;
  left: 50%;
  top: 50%;
  padding: 9px 13px;
  border-radius: 999px;
  background: rgba(255, 253, 248, 0.94);
  color: #66726a;
  box-shadow: 0 5px 20px rgba(30, 38, 33, 0.11);
  font-size: 9px;
  opacity: 1;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transition: opacity 220ms ease;
}

.map-status.is-hidden {
  opacity: 0;
}

.map-legend {
  position: absolute;
  z-index: 12;
  left: 13px;
  bottom: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 7px;
  background: rgba(255, 253, 248, 0.9);
  color: #67726b;
  box-shadow: 0 4px 14px rgba(27, 35, 30, 0.1);
  font-size: 8px;
}

.map-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  display: inline-block;
  border: 1px solid #fff;
  border-radius: 50%;
  background: var(--red);
}

.detail-drawer {
  position: fixed;
  z-index: 1700;
  top: 72px;
  right: 0;
  width: min(430px, 100%);
  height: calc(100vh - 72px);
  height: calc(100dvh - 72px);
  overflow: hidden;
  border-left: 1px solid var(--line);
  background: var(--surface);
  box-shadow: -18px 0 70px rgba(24, 31, 25, 0.2);
  visibility: hidden;
  transform: translateX(104%);
  transition:
    transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
    visibility 260ms;
}

.detail-drawer.is-open {
  visibility: visible;
  transform: translateX(0);
}

.detail-inner {
  position: relative;
  height: 100%;
  padding: 22px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.detail-close,
.modal-close {
  position: absolute;
  z-index: 3;
  top: 14px;
  right: 14px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 253, 248, 0.92);
  color: #4c5851;
  box-shadow: 0 5px 18px rgba(27, 35, 30, 0.12);
  cursor: pointer;
}

.detail-close svg,
.modal-close svg {
  width: 16px;
  height: 16px;
}

.detail-hero {
  margin: -22px -22px 18px;
  padding: 31px 22px 21px;
  background:
    linear-gradient(135deg, rgba(127, 40, 31, 0.97), rgba(174, 67, 47, 0.91)),
    var(--red);
  color: #fffaf1;
}

.detail-hero .eyebrow {
  color: rgba(255, 250, 241, 0.68);
}

.detail-hero h2 {
  margin: 6px 0 0;
  padding-right: 28px;
  font-family: var(--serif);
  font-size: 29px;
  line-height: 1.25;
}

.detail-hero p {
  margin: 8px 0 0;
  color: rgba(255, 250, 241, 0.75);
  font-size: 9px;
  line-height: 1.65;
}

.detail-section {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.detail-section:first-of-type {
  padding-top: 0;
}

.detail-section h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 17px;
}

.detail-prompt {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.75;
}

.memory-section {
  margin-top: 16px;
}

.memory-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.memory-heading p,
.memory-heading h3 {
  margin: 0;
}

.memory-heading p {
  color: var(--red);
  font-size: 8px;
  font-weight: 750;
  letter-spacing: 0.12em;
}

.memory-heading h3 {
  margin-top: 5px;
  font-family: var(--serif);
  font-size: 21px;
}

.refresh-button {
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #faf7f0;
  color: #66726b;
  font-size: 9px;
  cursor: pointer;
}

.setup-note,
.login-prompt,
.memory-empty,
.loading-box {
  margin-top: 12px;
  padding: 16px;
  border: 1px solid rgba(128, 92, 57, 0.15);
  border-radius: 12px;
  background: #faf7f0;
  color: #707b74;
  font-size: 10px;
  line-height: 1.75;
}

.setup-note strong {
  display: block;
  color: #744d31;
  font-size: 12px;
}

.setup-note p {
  margin: 6px 0 0;
}

.login-prompt p {
  margin: 0;
}

.memory-form {
  margin-top: 12px;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fcfaf5;
}

.memory-form-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.memory-form-head strong {
  font-size: 12px;
}

.memory-form-head small {
  color: #8d9690;
  font-size: 8px;
}

.memory-form textarea {
  width: 100%;
  min-height: 112px;
  margin-top: 10px;
  padding: 11px;
  resize: vertical;
  border: 1px solid rgba(41, 52, 45, 0.16);
  border-radius: 9px;
  outline: 0;
  background: var(--surface);
  color: var(--ink);
  font-size: 12px;
  line-height: 1.7;
}

.memory-form textarea:focus {
  border-color: rgba(161, 58, 44, 0.52);
  box-shadow: 0 0 0 3px rgba(161, 58, 44, 0.08);
}

.image-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 9px;
}

.image-upload {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border: 1px dashed rgba(41, 52, 45, 0.26);
  border-radius: 8px;
  background: #faf7f0;
  color: #536159;
  font-size: 9px;
  font-weight: 650;
  cursor: pointer;
}

.image-upload svg {
  width: 14px;
  height: 14px;
}

.image-upload input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

.image-toolbar small {
  color: #8d9690;
  font-size: 8px;
}

.image-preview-grid,
.memory-image-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-top: 9px;
}

.image-preview-grid:empty {
  display: none;
}

.image-preview,
.memory-image-grid a {
  position: relative;
  display: block;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 8px;
  background: #e9e4da;
}

.image-preview img,
.memory-image-grid img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.image-preview button {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 21px;
  height: 21px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(26, 34, 29, 0.74);
  color: #fff;
  font-size: 14px;
  line-height: 21px;
  cursor: pointer;
}

.memory-form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
}

.memory-form-footer small {
  max-width: 195px;
  color: #8d9690;
  font-size: 8px;
  line-height: 1.55;
}

.primary-button,
.secondary-button {
  min-height: 36px;
  padding: 0 15px;
  border: 0;
  border-radius: 8px;
  background: var(--red);
  color: #fffaf2;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}

.primary-button:disabled {
  opacity: 0.55;
  cursor: wait;
}

.secondary-button {
  border: 1px solid var(--line);
  background: #faf7f0;
  color: #59645d;
}

.form-message {
  min-height: 14px;
  margin: 8px 0 0;
  color: #66716b;
  font-size: 9px;
  line-height: 1.5;
}

.form-message:empty {
  display: none;
}

.form-message.is-error {
  color: #b44230;
}

.memory-list {
  display: grid;
  gap: 9px;
  margin-top: 12px;
}

.memory-card {
  padding: 13px;
  border: 1px solid rgba(41, 52, 45, 0.1);
  border-radius: 12px;
  background: var(--surface);
}

.memory-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.memory-avatar {
  width: 29px;
  height: 29px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(47, 116, 106, 0.11);
  color: #2d7067;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
}

.memory-card-head div {
  min-width: 0;
  flex: 1;
}

.memory-card-head strong,
.memory-card-head small {
  display: block;
}

.memory-card-head strong {
  overflow: hidden;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.memory-card-head small {
  margin-top: 2px;
  color: #8c958f;
  font-size: 8px;
}

.mine-badge {
  padding: 3px 6px;
  border-radius: 5px;
  background: rgba(183, 133, 54, 0.12);
  color: #8a6427;
  font-size: 8px;
}

.memory-card > p {
  margin: 10px 0 0;
  color: #4f5b54;
  font-size: 10px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}

.auth-modal {
  position: fixed;
  z-index: 3200;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 18px;
}

.auth-modal[hidden] {
  display: none;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  border: 0;
  background: rgba(23, 31, 26, 0.58);
}

.auth-card {
  position: relative;
  z-index: 1;
  width: min(420px, 100%);
  max-height: min(720px, calc(100vh - 36px));
  max-height: min(720px, calc(100dvh - 36px));
  overflow-y: auto;
  padding: 28px;
  border-radius: 19px;
  background: var(--surface);
  box-shadow: 0 28px 90px rgba(20, 27, 23, 0.32);
}

.auth-card h2 {
  margin: 7px 0 0;
  font-family: var(--serif);
  font-size: 27px;
  line-height: 1.25;
}

.auth-intro {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.7;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin-top: 19px;
  padding: 4px;
  border-radius: 10px;
  background: #f2eee6;
}

.auth-tabs[hidden] {
  display: none;
}

.auth-tabs button {
  min-height: 34px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #707a74;
  font-size: 10px;
  font-weight: 650;
  cursor: pointer;
}

.auth-tabs button.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(37, 45, 40, 0.08);
}

.auth-form {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}

.auth-form[hidden] {
  display: none;
}

.auth-form label {
  display: grid;
  gap: 6px;
}

.auth-form label[hidden] {
  display: none;
}

.auth-form label span {
  color: #59645d;
  font-size: 9px;
  font-weight: 650;
}

.auth-form input {
  width: 100%;
  height: 42px;
  padding: 0 12px;
  border: 1px solid rgba(41, 52, 45, 0.16);
  border-radius: 9px;
  outline: 0;
  background: #fcfaf5;
  color: var(--ink);
  font-size: 12px;
}

.auth-form input:focus {
  border-color: rgba(161, 58, 44, 0.52);
  box-shadow: 0 0 0 3px rgba(161, 58, 44, 0.08);
}

.auth-message {
  min-height: 16px;
  margin: 0;
  color: #69756e;
  font-size: 9px;
  line-height: 1.6;
}

.auth-message.is-error {
  color: #b44230;
}

.text-action {
  justify-self: start;
  margin-top: -4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--red);
  font-size: 9px;
  font-weight: 700;
  text-decoration: underline;
  cursor: pointer;
}

.text-action[hidden] {
  display: none;
}

.account-panel {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 10px;
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  background: #f5f1e9;
}

.account-panel[hidden] {
  display: none;
}

.account-avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(47, 116, 106, 0.12);
  color: #2d7067;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
}

.account-panel strong,
.account-panel small {
  display: block;
}

.account-panel strong {
  font-family: var(--serif);
  font-size: 17px;
}

.account-panel small {
  margin-top: 3px;
  color: #7d8780;
  font-size: 9px;
}

.account-panel .secondary-button {
  grid-column: 1 / -1;
  justify-self: start;
}

.privacy-note {
  margin: 16px 0 0;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  color: #818b84;
  font-size: 8px;
  line-height: 1.65;
}

.toast {
  position: fixed;
  z-index: 3400;
  left: 50%;
  bottom: 28px;
  max-width: min(420px, calc(100% - 32px));
  padding: 11px 16px;
  border-radius: 10px;
  background: #26352d;
  color: #fffaf2;
  box-shadow: 0 12px 36px rgba(18, 26, 21, 0.24);
  font-size: 10px;
  line-height: 1.5;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition:
    opacity 180ms ease,
    transform 180ms ease;
}

.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast.is-error {
  background: #9f3f2d;
}

@media (max-width: 860px) {
  body {
    overflow: visible;
  }

  .site-header {
    position: sticky;
    top: 0;
    height: 62px;
    padding: 0 13px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    font-size: 18px;
  }

  .brand-copy strong {
    font-size: 17px;
  }

  .brand-copy small,
  .source-label,
  .connection-badge {
    display: none;
  }

  .account-button {
    min-height: 31px;
    padding: 0 9px;
    font-size: 9px;
  }

  .anonymous-badge {
    min-height: 31px;
    padding: 0 8px;
    font-size: 8px;
  }

  .workspace {
    height: auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }

  .map-panel {
    order: 1;
    height: 68vw;
    min-height: 240px;
  }

  .places-panel {
    order: 2;
    padding: 20px 14px 30px;
    overflow: visible;
    border-top: 1px solid var(--line);
    border-right: 0;
  }

  .panel-intro h1 {
    font-size: 28px;
  }

  .place-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .place-card {
    grid-template-columns: 27px minmax(0, 1fr);
  }

  .place-card.is-child {
    width: 100%;
    margin-left: 0;
  }

  .memory-count {
    grid-column: 2;
    justify-self: start;
  }

  .detail-drawer {
    top: 62px;
    height: calc(100vh - 62px);
    height: calc(100dvh - 62px);
  }

  .auth-card {
    padding: 23px 18px 19px;
    border-radius: 16px;
  }
}

@media (max-width: 480px) {
  .place-list {
    grid-template-columns: 1fr;
  }

  .map-hint {
    max-width: 180px;
  }

  .map-actions button {
    width: 33px;
    height: 33px;
  }

  .detail-inner {
    padding: 18px;
  }

  .detail-hero {
    margin: -18px -18px 16px;
    padding: 28px 18px 18px;
  }

  .image-toolbar,
  .memory-form-footer {
    align-items: flex-start;
    flex-direction: column;
  }

  .memory-form-footer .primary-button {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

    { id: "senior-three-building", name: "高三教学楼", zone: "学习空间", x: 5.1, y: 57.8, prompt: "备考、晚自习和即将到来的结束" },

    { id: "globe-hall", name: "地球仪厅", zone: "校园地标", x: 33.2, y: 75.0, prompt: "金光穿过格栅，打在大理石的石墙上，也洒在我那异乡的梦里" },
    { id: "gymnasium", name: "体育馆", zone: "运动场地", x: 48.4, y: 74.0, prompt: "无体艺，不福一" },
    { id: "psychology-classroom", name: "心理教室", zone: "运动场地", x: 42.8, y: 82.8, parentId: "gymnasium", minor: true, prompt: "至少还蛮好玩的..." },

    { id: "sports-field", name: "操场", zone: "运动场地", x: 77.3, y: 74.5, prompt: "天地龙鳞、天天向上...福一体育组有力气" },
    { id: "dream-bookstore", name: "大梦书屋", zone: "校园地标", x: 63.8, y: 94.4, prompt: "还记得鳗鱼饭的味道吗？" },
    { id: "football-field", name: "足球场", zone: "运动场地", x: 88.8, y: 94.1, prompt: "我的我的..." },
    { id: "tree-lined-road", name: "林荫路", zone: "校园地标", x: 21.0, y: 96.3, prompt: "两边的树木，长好了没有？" },
  ];

  var state = {
    memories: [],
    memoriesLoaded: false,
    loadingMemories: false,
    memoryError: "",
    activePlaceId: null,
    query: "",
    zone: "all",
    files: [],
    previewUrls: [],
    busy: false,
    cloudChecking: false,
    cloudIssue: "",
  };

  var mapState = {
    scale: 1,
    x: 0,
    y: 0,
    baseHeight: 0,
    dragging: false,
    dragX: 0,
    dragY: 0,
    pinchDistance: 0,
  };

  var els = {
    connectionBadge: document.getElementById("connectionBadge"),
    placesSummary: document.getElementById("placesSummary"),
    placeSearch: document.getElementById("placeSearch"),
    zoneTabs: document.getElementById("zoneTabs"),
    listTitle: document.getElementById("listTitle"),
    resultCount: document.getElementById("resultCount"),
    placeList: document.getElementById("placeList"),
    mapViewport: document.getElementById("mapViewport"),
    mapCanvas: document.getElementById("mapCanvas"),
    mapMarkers: document.getElementById("mapMarkers"),
    mapStatus: document.getElementById("mapStatus"),
    campusMapImage: document.getElementById("campusMapImage"),
    zoomOut: document.getElementById("zoomOut"),
    zoomIn: document.getElementById("zoomIn"),
    fitMap: document.getElementById("fitMap"),
    detailDrawer: document.getElementById("detailDrawer"),
    detailContent: document.getElementById("detailContent"),
    closeDetail: document.getElementById("closeDetail"),
    toast: document.getElementById("toast"),
  };

  var toastTimer = null;

  function isConfigured() {
    return Boolean(
      String(CONFIG.supabaseUrl || "").trim() &&
        String(CONFIG.supabaseAnonKey || "").trim(),
    );
  }

  function cloudBaseUrl() {
    return String(CONFIG.supabaseUrl || "").replace(/\/+$/, "");
  }

  function escapeHTML(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function normalizeError(error) {
    var message = String((error && error.message) || "请稍后重试");
    if (/relation .* does not exist|PGRST205|could not find the table/i.test(message)) {
      return "云端回忆数据表尚未创建，请先运行最新的 supabase-setup.sql。";
    }
    if (/permission|row-level security|not authorized|jwt|401|403/i.test(message)) {
      return "匿名访问权限尚未配置，请在 Supabase 重新运行最新的 supabase-setup.sql。";
    }
    if (/bucket not found/i.test(message)) {
      return "云端照片存储桶尚未创建，请先运行最新的 supabase-setup.sql。";
    }
    if (/network|failed|load failed|timeout|请求失败/i.test(message)) {
      return "无法连接云端。请检查网络，或换用手机系统浏览器重试。";
    }
    return message;
  }

  function parseResponseText(text) {
    if (!text) return null;
    try {
      return JSON.parse(text);
    } catch (error) {
      return text;
    }
  }

  function cloudRequest(path, options) {
    options = options || {};
    return new Promise(function (resolve, reject) {
      if (!isConfigured()) {
        reject(new Error("云端服务尚未配置"));
        return;
      }
      var xhr = new XMLHttpRequest();
      xhr.open(options.method || "GET", cloudBaseUrl() + path, true);
      xhr.timeout = 30000;
      xhr.setRequestHeader("apikey", CONFIG.supabaseAnonKey);
      xhr.setRequestHeader(
        "Authorization",
        "Bearer " + CONFIG.supabaseAnonKey,
      );
      xhr.setRequestHeader("Accept", "application/json");
      var headers = options.headers || {};
      Object.keys(headers).forEach(function (name) {
        xhr.setRequestHeader(name, headers[name]);
      });
      var body = options.body;
      if (
        body &&
        !(window.Blob && body instanceof Blob) &&
        !(window.FormData && body instanceof FormData)
      ) {
        xhr.setRequestHeader("Content-Type", "application/json");
        body = JSON.stringify(body);
      }
      xhr.onload = function () {
        var data = parseResponseText(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(data);
          return;
        }
        var message =
          (data &&
            (data.msg ||
              data.message ||
              data.error_description ||
              data.error)) ||
          "请求失败";
        var requestError = new Error(message);
        requestError.status = xhr.status;
        requestError.data = data;
        reject(requestError);
      };
      xhr.onerror = function () {
        reject(new Error("网络请求失败"));
      };
      xhr.ontimeout = function () {
        reject(new Error("云端请求超时"));
      };
      xhr.send(body || null);
    });
  }

  function checkCloudHealth() {
    if (!isConfigured()) return Promise.resolve();
    state.cloudChecking = true;
    state.cloudIssue = "";
    renderCloudStatus();
    return cloudRequest("/rest/v1/fuzhou_one_memories?select=id&limit=1")
      .then(function () {
        return cloudRequest(
          "/storage/v1/object/list/fuzhou-memory-images",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: { prefix: "", limit: 1 },
          },
        );
      })
      .catch(function (error) {
        state.cloudIssue = normalizeError(error);
      })
      .then(function () {
        state.cloudChecking = false;
        renderCloudStatus();
        if (state.activePlaceId) renderDetail(state.activePlaceId);
      });
  }

  function normalizeMemory(row) {
    return {
      id: row.id,
      placeId: row.place_id,
      text: row.text,
      images: Array.isArray(row.images) ? row.images : [],
      createdAt: row.created_at,
    };
  }

  function loadMemories(options) {
    options = options || {};
    if (!isConfigured() || state.loadingMemories) {
      return Promise.resolve();
    }
    state.loadingMemories = true;
    state.memoryError = "";
    if (state.activePlaceId) renderDetail(state.activePlaceId);
    return cloudRequest(
      "/rest/v1/fuzhou_one_memories?select=id,place_id,text,images,created_at&order=created_at.desc&limit=5000",
    )
      .then(function (rows) {
        state.memories = Array.isArray(rows) ? rows.map(normalizeMemory) : [];
        state.memoriesLoaded = true;
      })
      .catch(function (error) {
        state.memoryError = normalizeError(error);
      })
      .then(function () {
        state.loadingMemories = false;
        renderMemories();
        renderList();
        if (state.activePlaceId) renderDetail(state.activePlaceId);
        if (!options.silent && state.memoryError) {
          showToast(state.memoryError, true);
        }
      });
  }

  function filteredPlaces() {
    var query = state.query.trim().toLowerCase();
    return PLACES.filter(function (place) {
      if (state.zone !== "all" && place.zone !== state.zone) return false;
      if (!query) return true;
      return (
        place.name.toLowerCase().indexOf(query) !== -1 ||
        place.zone.toLowerCase().indexOf(query) !== -1 ||
        place.prompt.toLowerCase().indexOf(query) !== -1
      );
    });
  }

  function memoriesForPlace(placeId) {
    return state.memories.filter(function (memory) {
      return memory.placeId === placeId;
    });
  }

  function formatDate(value) {
    var date = new Date(value);
    if (isNaN(date.getTime())) return "";
    try {
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).format(date);
    } catch (error) {
      return date.toLocaleDateString();
    }
  }

  function renderCloudStatus() {
    els.connectionBadge.textContent = state.cloudChecking
      ? "正在连接云端"
      : state.cloudIssue
        ? "云端待处理"
        : state.memoriesLoaded
          ? "匿名回忆已开放"
          : "匿名发布";
    els.connectionBadge.classList.toggle(
      "is-error",
      Boolean(state.cloudIssue),
    );
  }

  function renderMemories() {
    els.placesSummary.textContent =
      "共 " +
      PLACES.length +
      " 个地点，已收录 " +
      state.memories.length +
      " 条匿名回忆。无需登录即可发布文字和照片。";
    renderCloudStatus();
  }

  function renderList() {
    var places = filteredPlaces();
    var zoneLabels = {
      all: "全部地点",
      学习空间: "学习空间",
      运动场地: "运动场地",
      生活空间: "生活空间",
      校园地标: "校园地标",
    };
    els.listTitle.textContent = zoneLabels[state.zone] || "全部地点";
    els.resultCount.textContent = places.length + " 个地点";
    els.placeList.innerHTML = "";
    if (!places.length) {
      var empty = document.createElement("div");
      empty.className = "empty-list";
      empty.textContent = "没有找到匹配的地点。";
      els.placeList.appendChild(empty);
      return;
    }
    places.forEach(function (place, index) {
      var count = memoriesForPlace(place.id).length;
      var button = document.createElement("button");
      button.type = "button";
      button.className =
        "place-card" +
        (state.activePlaceId === place.id ? " is-selected" : "") +
        (place.parentId ? " is-child" : "");
      button.setAttribute("data-place-id", place.id);
      button.innerHTML =
        '<span class="place-card-index">' +
        (index + 1) +
        "</span>" +
        '<span class="place-card-main"><strong>' +
        escapeHTML(place.name) +
        "</strong><small>" +
        escapeHTML(place.zone) +
        "</small></span>" +
        '<span class="memory-count' +
        (count === 0 ? " is-empty" : "") +
        '">' +
        count +
        " 条回忆</span>";
      button.addEventListener("click", function () {
        openDetail(place.id);
      });
      els.placeList.appendChild(button);
    });
  }

  function createMarkers() {
    els.mapMarkers.innerHTML = "";
    PLACES.forEach(function (place) {
      var button = document.createElement("button");
      button.type = "button";
      button.className =
        "place-marker" + (place.minor ? " is-minor" : "");
      button.style.left = place.x + "%";
      button.style.top = place.y + "%";
      button.setAttribute("data-place-id", place.id);
      button.setAttribute("aria-label", place.name);
      button.innerHTML = "<span>" + escapeHTML(place.name) + "</span>";
      button.addEventListener("click", function (event) {
        event.stopPropagation();
        openDetail(place.id);
      });
      els.mapMarkers.appendChild(button);
    });
  }

  function updateSelectedMarkers() {
    Array.prototype.forEach.call(
      els.mapMarkers.querySelectorAll(".place-marker"),
      function (marker) {
        marker.classList.toggle(
          "is-selected",
          marker.getAttribute("data-place-id") === state.activePlaceId,
        );
      },
    );
  }

  function applyMapTransform(animate) {
    els.mapCanvas.classList.toggle("is-animating", Boolean(animate));
    els.mapCanvas.style.transform =
      "translate3d(" +
      mapState.x +
      "px," +
      mapState.y +
      "px,0) scale(" +
      mapState.scale +
      ")";
    if (animate) {
      window.setTimeout(function () {
        els.mapCanvas.classList.remove("is-animating");
      }, 280);
    }
  }

  function clampPan() {
    var viewportWidth = els.mapViewport.clientWidth;
    var viewportHeight = els.mapViewport.clientHeight;
    var contentWidth = viewportWidth * mapState.scale;
    var contentHeight = mapState.baseHeight * mapState.scale;
    mapState.x =
      contentWidth <= viewportWidth
        ? (viewportWidth - contentWidth) / 2
        : Math.min(0, Math.max(viewportWidth - contentWidth, mapState.x));
    mapState.y =
      contentHeight <= viewportHeight
        ? (viewportHeight - contentHeight) / 2
        : Math.min(0, Math.max(viewportHeight - contentHeight, mapState.y));
  }

  function fitMap(animate) {
    var width = els.mapViewport.clientWidth;
    if (!width) return;
    els.mapCanvas.style.width = width + "px";
    mapState.baseHeight = width / MAP_RATIO;
    els.mapCanvas.style.height = mapState.baseHeight + "px";
    mapState.scale = 1;
    mapState.x = 0;
    mapState.y =
      (els.mapViewport.clientHeight - mapState.baseHeight) / 2;
    clampPan();
    applyMapTransform(Boolean(animate));
  }

  function zoomAt(factor, clientX, clientY) {
    var rect = els.mapViewport.getBoundingClientRect();
    var pointX =
      clientX == null ? rect.width / 2 : clientX - rect.left;
    var pointY =
      clientY == null ? rect.height / 2 : clientY - rect.top;
    var oldScale = mapState.scale;
    var nextScale = Math.max(1, Math.min(4, oldScale * factor));
    var worldX = (pointX - mapState.x) / oldScale;
    var worldY = (pointY - mapState.y) / oldScale;
    mapState.scale = nextScale;
    mapState.x = pointX - worldX * nextScale;
    mapState.y = pointY - worldY * nextScale;
    clampPan();
    applyMapTransform(true);
  }

  function safeCloudImageUrl(value) {
    try {
      var url = new URL(String(value));
      var origin = new URL(cloudBaseUrl()).origin;
      var bucket = CONFIG.storageBucket || "fuzhou-memory-images";
      return url.origin === origin &&
        url.pathname.indexOf("/storage/v1/object/public/" + bucket + "/") === 0
        ? url.href
        : "";
    } catch (error) {
      return "";
    }
  }

  function imagePreviewHTML() {
    return state.files
      .map(function (file, index) {
        var url = URL.createObjectURL(file);
        state.previewUrls.push(url);
        return (
          '<span class="image-preview"><img src="' +
          escapeHTML(url) +
          '" alt="待上传照片" /><button type="button" data-remove-image="' +
          index +
          '" aria-label="移除照片">×</button></span>'
        );
      })
      .join("");
  }

  function revokePreviewUrls() {
    state.previewUrls.forEach(function (url) {
      URL.revokeObjectURL(url);
    });
    state.previewUrls = [];
  }

  function renderMemoryCards(memories) {
    if (!memories.length) {
      return '<div class="memory-empty">这里还没有回忆。写下第一段匿名的校园故事吧。</div>';
    }
    return memories
      .map(function (memory) {
        var images = memory.images
          .map(safeCloudImageUrl)
          .filter(Boolean)
          .map(function (url) {
            return (
              '<a href="' +
              escapeHTML(url) +
              '" target="_blank" rel="noreferrer"><img src="' +
              escapeHTML(url) +
              '" alt="匿名用户上传的校园回忆照片" loading="lazy" /></a>'
            );
          })
          .join("");
        return (
          '<article class="memory-card">' +
          '<div class="memory-card-head"><span class="memory-avatar">匿</span>' +
          "<div><strong>匿名同学</strong><small>" +
          escapeHTML(formatDate(memory.createdAt)) +
          "</small></div></div>" +
          "<p>" +
          escapeHTML(memory.text) +
          "</p>" +
          (images
            ? '<div class="memory-image-grid">' + images + "</div>"
            : "") +
          "</article>"
        );
      })
      .join("");
  }

  function renderDetail(placeId) {
    var place = PLACES.filter(function (item) {
      return item.id === placeId;
    })[0];
    if (!place) return;
    revokePreviewUrls();
    state.activePlaceId = placeId;
    var memories = memoriesForPlace(placeId);
    var content;

    if (!isConfigured()) {
      content =
        '<div class="setup-note"><strong>云端服务尚未配置</strong><p>请检查 cloud-config.js。</p></div>';
    } else if (state.cloudIssue) {
      content =
        '<div class="setup-note"><strong>匿名回忆功能尚未就绪</strong><p>' +
        escapeHTML(state.cloudIssue) +
        '</p><button class="text-action" type="button" data-retry-cloud>重新检测云端</button></div>';
    } else if (!state.memoriesLoaded && (state.loadingMemories || !state.memoryError)) {
      content = '<div class="loading-box">正在加载这里的匿名回忆…</div>';
    } else if (!state.memoriesLoaded && state.memoryError) {
      content =
        '<div class="setup-note"><strong>回忆读取失败</strong><p>' +
        escapeHTML(state.memoryError) +
        '</p><button class="text-action" type="button" data-refresh-memories>重新加载</button></div>';
    } else {
      content =
        '<form class="memory-form" id="memoryForm">' +
        '<div class="memory-form-head"><strong>匿名写下这里的故事</strong><small>无需登录 · 不显示姓名</small></div>' +
        '<textarea name="text" maxlength="1000" placeholder="写下你想留下的校园回忆、感想或照片说明…" required></textarea>' +
        '<div class="image-toolbar"><label class="image-upload"><input id="memoryImages" type="file" accept="image/jpeg,image/png,image/webp" multiple /><svg aria-hidden="true"><use href="#icon-image"></use></svg><span>添加照片</span></label><small>最多 6 张，页面会显示为匿名上传</small></div>' +
        '<div class="image-preview-grid" id="imagePreviewGrid">' +
        imagePreviewHTML() +
        "</div>" +
        '<div class="memory-form-footer"><small>请勿上传包含身份证、住址、联系方式等敏感信息的照片。</small><button class="primary-button" type="submit">匿名发布</button></div>' +
        '<p class="form-message" id="formMessage" aria-live="polite"></p>' +
        "</form>" +
        (state.memoryError
          ? '<p class="form-message is-error">' +
            escapeHTML(state.memoryError) +
            "</p>"
          : "") +
        '<div class="memory-list">' +
        renderMemoryCards(memories) +
        "</div>";
    }

    var aboutSection = place.prompt
      ? '<section class="detail-section"><h3>关于这里</h3><p class="detail-prompt">' +
        escapeHTML(place.prompt) +
        "</p></section>"
      : "";

    els.detailContent.innerHTML =
      '<header class="detail-hero"><p class="eyebrow">' +
      escapeHTML(place.zone.toUpperCase()) +
      '</p><h2 id="detailTitle">' +
      escapeHTML(place.name) +
      "</h2><p>福州一中校园回忆地点 · 匿名分享</p></header>" +
      aboutSection +
      '<section class="detail-section memory-section"><div class="memory-heading"><div><p>匿名回忆</p><h3>' +
      (memories.length ? memories.length + " 段故事" : "留下第一段故事") +
      '</h3></div><button class="refresh-button" type="button" data-refresh-memories>刷新</button></div>' +
      content +
      "</section>";
    els.detailDrawer.classList.add("is-open");
    els.detailDrawer.setAttribute("aria-hidden", "false");
    updateSelectedMarkers();
    Array.prototype.forEach.call(
      els.placeList.querySelectorAll(".place-card"),
      function (card) {
        card.classList.toggle(
          "is-selected",
          card.getAttribute("data-place-id") === placeId,
        );
      },
    );
  }

  function openDetail(placeId) {
    state.activePlaceId = placeId;
    renderDetail(placeId);
    if (!state.memoriesLoaded && !state.loadingMemories) {
      loadMemories({ silent: true });
    }
  }

  function closeDetail() {
    revokePreviewUrls();
    state.activePlaceId = null;
    state.files = [];
    els.detailDrawer.classList.remove("is-open");
    els.detailDrawer.setAttribute("aria-hidden", "true");
    updateSelectedMarkers();
    Array.prototype.forEach.call(
      els.placeList.querySelectorAll(".place-card.is-selected"),
      function (card) {
        card.classList.remove("is-selected");
      },
    );
  }

  function createMemoryId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    var bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < bytes.length; i += 1) {
        bytes[i] = Math.floor(Math.random() * 256);
      }
    }
    bytes[6] = (bytes[6] & 15) | 64;
    bytes[8] = (bytes[8] & 63) | 128;
    var hex = "";
    for (var j = 0; j < bytes.length; j += 1) {
      hex += (bytes[j] + 256).toString(16).slice(1);
    }
    return (
      hex.slice(0, 8) +
      "-" +
      hex.slice(8, 12) +
      "-" +
      hex.slice(12, 16) +
      "-" +
      hex.slice(16, 20) +
      "-" +
      hex.slice(20)
    );
  }

  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var image = new Image();
      var url = URL.createObjectURL(file);
      image.onload = function () {
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("无法读取这张照片"));
      };
      image.src = url;
    });
  }

  function prepareImage(file) {
    if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) {
      return Promise.reject(new Error("仅支持 JPG、PNG 或 WebP 照片"));
    }
    if (file.size > MAX_IMAGE_BYTES) {
      return Promise.reject(new Error("单张照片不能超过 10MB"));
    }
    if (file.size <= 1.8 * 1024 * 1024) return Promise.resolve(file);
    return readImage(file).then(function (image) {
      var scale = Math.min(1, 1800 / Math.max(image.width, image.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      var context = canvas.getContext("2d");
      context.fillStyle = "#fffaf2";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      if (!canvas.toBlob) return file;
      return new Promise(function (resolve) {
        canvas.toBlob(
          function (blob) {
            if (!blob) resolve(file);
            else blob.name = "memory.jpg";
            resolve(blob || file);
          },
          "image/jpeg",
          0.82,
        );
      });
    });
  }

  function addSelectedImages(input) {
    var incoming = Array.prototype.slice.call(input.files || []);
    var available = MAX_IMAGES - state.files.length;
    if (incoming.length > available) {
      showToast("每条回忆最多上传 6 张照片", true);
    }
    incoming = incoming.slice(0, Math.max(0, available));
    input.value = "";
    if (!incoming.length) return;
    Promise.all(
      incoming.map(function (file) {
        return prepareImage(file).catch(function (error) {
          showToast(error.message, true);
          return null;
        });
      }),
    ).then(function (files) {
      state.files = state.files.concat(
        files.filter(function (file) {
          return Boolean(file);
        }),
      );
      refreshImagePreviews();
    });
  }

  function refreshImagePreviews() {
    var preview = document.getElementById("imagePreviewGrid");
    if (!preview) return;
    revokePreviewUrls();
    preview.innerHTML = imagePreviewHTML();
  }

  function uploadImage(file, objectPath) {
    var bucket = CONFIG.storageBucket || "fuzhou-memory-images";
    var encodedPath = objectPath
      .split("/")
      .map(function (part) {
        return encodeURIComponent(part);
      })
      .join("/");
    return cloudRequest("/storage/v1/object/" + bucket + "/" + encodedPath, {
      method: "POST",
      headers: {
        "Content-Type": file.type || "image/jpeg",
        "x-upsert": "false",
      },
      body: file,
    }).then(function () {
      return (
        cloudBaseUrl() +
        "/storage/v1/object/public/" +
        bucket +
        "/" +
        encodedPath
      );
    });
  }

  function submitMemory(event) {
    event.preventDefault();
    if (state.busy || !state.activePlaceId || state.cloudIssue) return;
    var form = event.target;
    var text = String(form.elements.text.value || "").trim();
    var message = form.querySelector("#formMessage");
    var submit = form.querySelector(".primary-button");
    if (text.length < 2) {
      message.textContent = "请至少写 2 个字。";
      message.classList.add("is-error");
      return;
    }
    state.busy = true;
    submit.disabled = true;
    submit.textContent = state.files.length ? "正在上传照片…" : "正在发布…";
    message.textContent = "";
    message.classList.remove("is-error");
    var memoryId = createMemoryId();
    var placeId = state.activePlaceId;
    var files = state.files.slice();

    Promise.all(
      files.map(function (file, index) {
        var extension =
          file.type === "image/png"
            ? "png"
            : file.type === "image/webp"
              ? "webp"
              : "jpg";
        return uploadImage(
          file,
          "anonymous/" +
            placeId +
            "/" +
            memoryId +
            "/" +
            Date.now() +
            "-" +
            index +
            "-" +
            Math.floor(Math.random() * 100000) +
            "." +
            extension,
        );
      }),
    )
      .then(function (images) {
        return cloudRequest("/rest/v1/fuzhou_one_memories", {
          method: "POST",
          headers: { Prefer: "return=representation" },
          body: {
            id: memoryId,
            place_id: placeId,
            text: text,
            images: images,
          },
        });
      })
      .then(function (rows) {
        var saved =
          Array.isArray(rows) && rows[0]
            ? normalizeMemory(rows[0])
            : normalizeMemory({
                id: memoryId,
                place_id: placeId,
                text: text,
                images: [],
                created_at: new Date().toISOString(),
              });
        state.memories.unshift(saved);
        state.files = [];
        state.memoryError = "";
        renderMemories();
        renderList();
        renderDetail(placeId);
        showToast("匿名回忆已发布");
      })
      .catch(function (error) {
        message.textContent = normalizeError(error);
        message.classList.add("is-error");
        submit.disabled = false;
        submit.textContent = "匿名发布";
      })
      .then(function () {
        state.busy = false;
      });
  }

  function showToast(message, isError) {
    window.clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.classList.toggle("is-error", Boolean(isError));
    els.toast.classList.add("is-visible");
    toastTimer = window.setTimeout(function () {
      els.toast.classList.remove("is-visible");
    }, 3400);
  }

  function bindMapInteraction() {
    els.zoomIn.addEventListener("click", function () {
      zoomAt(1.28);
    });
    els.zoomOut.addEventListener("click", function () {
      zoomAt(1 / 1.28);
    });
    els.fitMap.addEventListener("click", function () {
      fitMap(true);
    });
    els.mapViewport.addEventListener(
      "wheel",
      function (event) {
        event.preventDefault();
        zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX, event.clientY);
      },
      { passive: false },
    );
    els.mapViewport.addEventListener("mousedown", function (event) {
      if (event.button !== 0) return;
      mapState.dragging = true;
      mapState.dragX = event.clientX;
      mapState.dragY = event.clientY;
      els.mapViewport.classList.add("is-dragging");
    });
    window.addEventListener("mousemove", function (event) {
      if (!mapState.dragging) return;
      mapState.x += event.clientX - mapState.dragX;
      mapState.y += event.clientY - mapState.dragY;
      mapState.dragX = event.clientX;
      mapState.dragY = event.clientY;
      clampPan();
      applyMapTransform(false);
    });
    window.addEventListener("mouseup", function () {
      mapState.dragging = false;
      els.mapViewport.classList.remove("is-dragging");
    });
    var lastX = 0;
    var lastY = 0;
    els.mapViewport.addEventListener(
      "touchstart",
      function (event) {
        if (event.touches.length === 1) {
          lastX = event.touches[0].clientX;
          lastY = event.touches[0].clientY;
        } else if (event.touches.length === 2) {
          mapState.pinchDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY,
          );
        }
      },
      { passive: false },
    );
    els.mapViewport.addEventListener(
      "touchmove",
      function (event) {
        event.preventDefault();
        if (event.touches.length === 1) {
          var touch = event.touches[0];
          mapState.x += touch.clientX - lastX;
          mapState.y += touch.clientY - lastY;
          lastX = touch.clientX;
          lastY = touch.clientY;
          clampPan();
          applyMapTransform(false);
        } else if (event.touches.length === 2) {
          var distance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY,
          );
          if (mapState.pinchDistance > 0) {
            zoomAt(
              distance / mapState.pinchDistance,
              (event.touches[0].clientX + event.touches[1].clientX) / 2,
              (event.touches[0].clientY + event.touches[1].clientY) / 2,
            );
          }
          mapState.pinchDistance = distance;
        }
      },
      { passive: false },
    );
    els.mapViewport.addEventListener(
      "touchend",
      function () {
        mapState.pinchDistance = 0;
      },
      { passive: true },
    );
    window.addEventListener("resize", function () {
      fitMap(false);
    });
  }

  function bindUI() {
    els.closeDetail.addEventListener("click", closeDetail);
    els.placeSearch.addEventListener("input", function () {
      state.query = els.placeSearch.value;
      renderList();
    });
    els.zoneTabs.addEventListener("click", function (event) {
      var button = event.target.closest("button[data-zone]");
      if (!button) return;
      state.zone = button.getAttribute("data-zone");
      Array.prototype.forEach.call(
        els.zoneTabs.querySelectorAll("button"),
        function (item) {
          item.classList.toggle("is-active", item === button);
        },
      );
      renderList();
    });
    els.detailContent.addEventListener("click", function (event) {
      if (event.target.closest("[data-retry-cloud]")) {
        checkCloudHealth();
        return;
      }
      if (event.target.closest("[data-refresh-memories]")) {
        loadMemories();
        return;
      }
      var remove = event.target.closest("[data-remove-image]");
      if (remove) {
        state.files.splice(Number(remove.getAttribute("data-remove-image")), 1);
        refreshImagePreviews();
      }
    });
    els.detailContent.addEventListener("change", function (event) {
      if (event.target && event.target.id === "memoryImages") {
        addSelectedImages(event.target);
      }
    });
    els.detailContent.addEventListener("submit", function (event) {
      if (event.target && event.target.id === "memoryForm") {
        submitMemory(event);
      }
    });
    document.addEventListener("keydown", function (event) {
      if (
        event.key === "Escape" &&
        els.detailDrawer.classList.contains("is-open")
      ) {
        closeDetail();
      }
    });
  }

  function init() {
    renderMemories();
    renderList();
    createMarkers();
    bindUI();
    bindMapInteraction();
    if (els.campusMapImage.complete && els.campusMapImage.naturalWidth) {
      fitMap(false);
      els.mapStatus.classList.add("is-hidden");
    } else {
      els.campusMapImage.addEventListener("load", function () {
        fitMap(false);
        els.mapStatus.classList.add("is-hidden");
      });
      els.campusMapImage.addEventListener("error", function () {
        els.mapStatus.textContent = "校园地图加载失败";
      });
    }
    checkCloudHealth().then(function () {
      loadMemories({ silent: true });
    });
  }

  init();
})();

</script>
  </body>
</html>
